name: Regenerate dependency lockfile (repair branch only)
on:
  push:
    branches: [fix/dependency-resolution-2026-11-25]
    paths:
      - '.github/workflows/repair-lockfile.yml'
permissions:
  contents: write
concurrency:
  group: repair-lockfile-${{ github.ref }}
  cancel-in-progress: false
jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dependency-resolution-2026-11-25
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Resolve dependencies without lifecycle scripts
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify clean dependency resolution
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Commit verified lockfile to repair branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- package.json package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Regenerate npm lockfile with compatible peer dependencies"
          git push origin HEAD:refs/heads/fix/dependency-resolution-2026-11-25
